name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Tests and cabinet compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      game-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dev tooling and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run unit and repository checks
        run: npm test

      - name: Stage the site and verify inside the pinned cabinet
        run: |
          npm run cabinet:setup
          npm run build
          npm run test:cabinet

      - name: Record the tested artifact digest
        id: digest
        run: echo "sha256=$(sha256sum _site/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cabinet-failure
          path: test-results/
          if-no-files-found: ignore

