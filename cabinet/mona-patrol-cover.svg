<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" shape-rendering="crispEdges">
  <title>8-bit lunar mountains, repository outpost, crater, and bug saucers</title>
  <!-- Warm 8-bit arcade cream sky -->
  <rect width="160" height="90" fill="#fff7df"/>
  <rect width="160" height="16" fill="#f7efd4"/>

  <!-- Pixel stars -->
  <path d="M14 8h3v1h-3zM15 7h1v3h-1zM68 6h3v1h-3zM69 5h1v3h-1zM108 11h2v2h-2zM38 18h2v2h-2z" fill="#ded4f1"/>

  <!-- Pixelated lunar globe in upper right -->
  <path d="M132 7h8v1h2v2h1v6h-1v2h-2v1h-8v-1h-2v-2h-1v-6h1V8h2z" fill="#34313e"/>
  <path d="M132 8h8v1h2v2h1v4h-1v2h-2v1h-8v-1h-2v-2h-1v-4h1V9h2z" fill="#fffdf4"/>
  <path d="M133 10h2v2h-2zM137 13h3v2h-3z" fill="#ded4f1"/>

  <!-- Stepped 8-bit lavender mountain peaks -->
  <path d="M0 54h12v-4h12v-4h12v4h10v4h14v-3h12v-5h14v-4h14v4h12v4h14v3h16v-3h18v18H0z" fill="#ded4f1"/>
  <path d="M36 50h10v4h14v14H36zM100 46h12v4h14v18h-26z" fill="#c3b2e3"/>
  <path d="M0 53h12v-4h12v-4h12v4h10v4h14v-3h12v-5h14v-4h14v4h12v4h14v3h16v-3h18v1h-18v3h-16v-3h-14v-4h-12v-4h-14v4H72v5H60v3H46v-4H36v-4H24v4H12v4H0z" fill="#34313e"/>

  <!-- Stepped 8-bit mint hills + pixel REPO lunar dome -->
  <path d="M23 51h1v-5h1v5z" fill="#34313e"/>
  <rect x="22" y="44" width="3" height="2" fill="#ed9eb7"/>
  <rect x="19" y="51" width="9" height="6" fill="#34313e"/>
  <rect x="20" y="52" width="7" height="4" fill="#fffdf4"/>
  <rect x="21" y="49" width="5" height="2" fill="#96dce2"/>

  <path d="M0 61h20v-3h22v2h20v3h28v-3h24v-2h22v3h24v12H0z" fill="#c5e7b1"/>
  <path d="M0 60h20v-3h22v2h20v3h28v-3h24v-2h22v3h24v1h-24v-3h-22v2H90v3H62v-3H42v-2H20v3H0z" fill="#34313e"/>

  <!-- Checkpoint B pixel signpost on right -->
  <rect x="139" y="53" width="1" height="17" fill="#34313e"/>
  <rect x="140" y="53" width="10" height="7" fill="#34313e"/>
  <rect x="141" y="54" width="8" height="5" fill="#c5e7b1"/>
  <path fill-rule="evenodd" d="M143 55h3v1h1v1h-1v1h1v1h-4zm1 1h2v1h-2zm0 2h2v1h-2z" fill="#34313e"/>

  <!-- 8-bit pixel boulder -->
  <path d="M118 63h5v1h1v5h-8v-5h2z" fill="#34313e"/>
  <path d="M118 64h5v4h-6v-3h1z" fill="#ded4f1"/>

  <!-- Stepped 8-bit coral-peach lunar road + central stepped crater -->
  <path d="M0 70h66v3h4v4h16v-4h4v-3h70v20H0z" fill="#ffb7a5"/>
  <path d="M0 75h66v2h4v4h16v-4h4v-2h70v15H0z" fill="#e89592"/>
  <path d="M0 80h160v10H0z" fill="#d8cde9"/>
  <path d="M0 69h66v4h4v4h16v-4h4v-4h70v2H90v4h-4v4H70v-4h-4v-4H0z" fill="#34313e"/>

  <!-- Crater pixel hazard blocks -->
  <rect x="63" y="67" width="3" height="3" fill="#f5cc66"/>
  <rect x="90" y="67" width="3" height="3" fill="#f5cc66"/>

  <!-- Left-to-right 8-bit pixel Bug Saucers -->
  <g transform="translate(18 26)">
    <path d="M2 0h1v1h1v1h6V1h1V0h1v1h-1v1h1v2h2v3h-2v1h-1v2h-1V8H5v2H4V8H2V7H0V4h2V2h1V1H2z" fill="#34313e"/>
    <rect x="4" y="2" width="6" height="2" fill="#96dce2"/>
    <rect x="1" y="4" width="12" height="3" fill="#ed9eb7"/>
    <path d="M3 5h1v1H3zM6 5h2v1H6zM10 5h1v1h-1z" fill="#fffdf4"/>
  </g>
  <g transform="translate(114 20)">
    <path d="M2 0h1v1h1v1h6V1h1V0h1v1h-1v1h1v2h2v3h-2v1h-1v2h-1V8H5v2H4V8H2V7H0V4h2V2h1V1H2z" fill="#34313e"/>
    <rect x="4" y="2" width="6" height="2" fill="#96dce2"/>
    <rect x="1" y="4" width="12" height="3" fill="#ed9eb7"/>
    <path d="M3 5h1v1H3zM6 5h2v1H6zM10 5h1v1h-1z" fill="#fffdf4"/>
  </g>
</svg>
