  <path d="M8 25h2v2H8zM16 25h2v2h-2zM24 25h2v2h-2z" fill="#2b2835"/>
  <path d="M6 27h6v5H6zM14 27h6v5h-6zM22 27h6v5h-6z" fill="#2b2835"/>
